<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdulrahman Ehab - Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:Inter,system-ui;background:#080f1f;overflow:hidden}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,#132040,#0e1a33);border-radius:36px;padding:38px 28px 28px;text-align:center;border:1px solid rgba(255,215,128,0.15);box-shadow:0 30px 80px rgba(0,0,0,0.6);z-index:2}
.avatar{width:145px;height:145px;margin:0 auto 18px;border-radius:28px;overflow:hidden;border:3px solid #d9b86c;box-shadow:0 10px 35px rgba(0,0,0,0.4)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:32px;color:#e8d5a3;font-weight:900}
.handle{color:#8ea0c2;margin:6px 0 4px;font-size:14px}
.sub{color:#d9b86c;letter-spacing:3px;font-size:11px;margin-bottom:26px;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:16px;perspective:1200px}
.link{position:relative;display:flex;align-items:center;justify-content:space-between;padding:19px 22px;background:rgba(0,0,0,0.4);border-radius:18px;color:#fff;text-decoration:none;font-weight:800;border:1px solid rgba(255,215,128,0.18);transform-style:preserve-3d;transition:all 0.15s linear;overflow:hidden}
.link::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center, rgba(255,215,128,0.25), transparent 70%);opacity:0;transition:0.4s}
.link:hover::before{opacity:1}
/* حركة الشفط */
.link.suck{transform:perspective(800px) scale(1.12) translateZ(60px) rotateX(10deg) rotateY(-6deg) !important;border-color:#ffd67e !important;box-shadow:0 0 0 2px #ffd67e, 0 0 15px #ffd67e, 0 0 40px rgba(255,214,126,0.9), 0 30px 60px rgba(0,0,0,0.7) !important;background:rgba(20,35,70,0.9) !important}
.link.suck::after{content:"";position:absolute;inset:-50%;background:radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);animation:suckAnim 0.6s ease}
@keyframes suckAnim{0%{transform:scale(0);opacity:1}100%{transform:scale(2.5);opacity:0}}
.footer{font-size:9px;letter-spacing:3px;color:#5a6a8a;margin-top:24px}
</style>
</head>
<body>
<div class="card">
<div class="avatar"><img src="profile.jpg" onerror="this.parentElement.innerHTML='AE'"></div>
<h1>Abdulrahman Ehab</h1>
<div class="handle">@Abdulrahman_Ehab37</div>
<div class="sub">CEO • MAGNETIC CEO 2026</div>
<div class="links" id="links">
<a class="link" href="https://www.tiktok.com/@Abdulrahman_Ehab37">🎵 TikTok <span>↗</span></a>
<a class="link" href="https://www.instagram.com/Abdulrahman_Ehab37">📸 Instagram <span>↗</span></a>
<a class="link" href="https://www.facebook.com/Abdulrahman.Ehab.37">📘 Facebook <span>↗</span></a>
<a class="link" href="https://wa.me/201210746111">💬 WhatsApp <span>↗</span></a>
</div>
<div class="footer">SUCTION • GOLD • 3D • CEO</div>
</div>
<script>
const links = document.querySelectorAll('.link');
// 1- تاتش و هوفر
links.forEach(btn=>{
  const add = ()=>btn.classList.add('suck');
  const rem = ()=>btn.classList.remove('suck');
  btn.addEventListener('touchstart',add);
  btn.addEventListener('touchend',()=>setTimeout(rem,400));
  btn.addEventListener('mouseenter',add);
  btn.addEventListener('mouseleave',rem);
  btn.addEventListener('mousemove',(e)=>{
    let rect = btn.getBoundingClientRect();
    let x = e.clientX - rect.left - rect.width/2;
    let y = e.clientY - rect.top - rect.height/2;
    if(btn.classList.contains('suck')){
      btn.style.transform = `perspective(800px) scale(1.12) translateZ(60px) rotateX(${-y*0.15}deg) rotateY(${x*0.15}deg)`;
    }
  });
});
// 2- ميل الموبايل نفسه
if(window.DeviceOrientationEvent){
  window.addEventListener('deviceorientation',(e)=>{
    let x = e.gamma || 0;
    let y = e.beta || 0;
    links.forEach(btn=>{
      if(!btn.classList.contains('suck')){
        btn.style.transform = `perspective(800px) rotateX(${(y-45)*0.2}deg) rotateY(${x*0.2}deg)`;
      }
    });
  });
}
</script>
</body>
</html>
