<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abdulrahman Ehab - Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:Inter,system-ui;background:#080f1f}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,#132040,#0e1a33);border-radius:36px;padding:38px 28px 28px;text-align:center;border:1px solid rgba(255,215,128,0.15);box-shadow:0 30px 80px rgba(0,0,0,0.6)}
.avatar{width:145px;height:145px;margin:0 auto 18px;border-radius:28px;overflow:hidden;border:3px solid #d9b86c;box-shadow:0 10px 35px rgba(0,0,0,0.4);background:#0f172a;color:#d9b86c;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:32px;color:#e8d5a3;font-weight:900}
.handle{color:#8ea0c2;margin:6px 0 4px;font-size:14px}
.sub{color:#d9b86c;letter-spacing:3px;font-size:11px;margin-bottom:26px;text-transform:uppercase}
.links{display:flex;flex-direction:column;gap:16px;perspective:1200px}
.link{display:flex;align-items:center;justify-content:space-between;padding:19px 22px;background:rgba(0,0,0,0.4);border-radius:18px;color:#fff;text-decoration:none;font-weight:800;border:1px solid rgba(255,215,128,0.18);transform-style:preserve-3d;transition:all 0.15s linear}
.link.suck{transform:perspective(800px) scale(1.12) translateZ(60px) rotateX(10deg) rotateY(-6deg) !important;border-color:#ffd67e !important;box-shadow:0 0 0 2px #ffd67e, 0 0 40px rgba(255,214,126,0.9), 0 30px 60px rgba(0,0,0,0.7) !important}
.footer{font-size:9px;letter-spacing:3px;color:#5a6a8a;margin-top:24px}
</style>
</head>
<body>
<div class="card">
<div class="avatar" id="av">AE</div>
<h1>Abdulrahman Ehab</h1>
<div class="handle">@Abdulrahman_Ehab37</div>
<div class="sub">CEO • MAGNETIC CEO 2026</div>
<div class="links">
<a class="link" href="https://www.tiktok.com/@Abdulrahman_Ehab37">🎵 TikTok <span>↗</span></a>
<a class="link" href="https://www.instagram.com/Abdulrahman_Ehab37">📸 Instagram <span>↗</span></a>
<a class="link" href="https://www.facebook.com/Abdulrahman.Ehab.37">📘 Facebook <span>↗</span></a>
<a class="link" href="https://wa.me/201210746111">💬 WhatsApp <span>↗</span></a>
</div>
<div class="footer">SUCTION • GOLD • 3D • CEO</div>
</div>
<script>
// حاول تحمل الصورة لو موجودة
let img = new Image();
img.src = "profile.jpg?v=" + Date.now();
img.onload = ()=>{ document.getElementById('av').innerHTML = ""; document.getElementById('av').appendChild(img); };
const links = document.querySelectorAll('.link');
links.forEach(btn=>{
  btn.addEventListener('touchstart',()=>btn.classList.add('suck'));
  btn.addEventListener('touchend',()=>setTimeout(()=>btn.classList.remove('suck'),400));
  btn.addEventListener('mouseenter',()=>btn.classList.add('suck'));
  btn.addEventListener('mouseleave',()=>btn.classList.remove('suck'));
});
</script>
</body>
</html>
