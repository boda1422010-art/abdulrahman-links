body{min-height:100vh;background:#050507;display:flex;justify-content:center;align-items:center;padding:20px;overflow:hidden;position:relative}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.6;animation:float 8s infinite ease-in-out}

.card{position:relative;width:100%;max-width:390px;background:rgba(15,15,20,0.7);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.1);border-radius:32px;padding:32px 24px;text-align:center;box-shadow:0 0 80px rgba(124,58,237,0.2)}

.badge{display:inline-block;margin:8px 0 20px;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.4);color:#a78bfa;padding:4px 12px;border-radius:99px;font-size:12px}
.links{display:flex;flex-direction:column;gap:12px}
.link{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:16px;color:#fff;text-decoration:none;font-weight:700;transition:0.3s;overflow:hidden}
.link::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:0.6s}
.link:hover::before{left:100%}
.link:hover{transform:translateY(-2px) scale(1.02);background:rgba(255,255,255,0.12);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.link.wa{background:linear-gradient(135deg,#25D366,#128C7E);border:0}
.link.wa:hover{box-shadow:0 10px 30px rgba(37,211,102,0.4)}
.foot{margin-top:20px;color:rgba(255,255,255,0.3);font-size:11px}
