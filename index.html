<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
background:
radial-gradient(800px 500px at 75% 15%, rgba(255,185,80,0.35) 0%, rgba(255,220,120,0.15) 30%, transparent 70%),
radial-gradient(600px 400px at 20% 80%, rgba(120,80,30,0.2) 0%, transparent 60%),
linear-gradient(180deg,#fef9ef 0%,#fff6e3 20%,#ffeec6 45%,#e8d5a8 100%);

overflow:hidden;
}
body::before{
content:'';position:fixed;inset:0;
background:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1200&blur=20') center/cover;
filter:blur(22px) brightness(1.15) saturate(1.2);
opacity:0.55;z-index:-2;
}
body::after{
content:'';position:fixed;inset:0;
background:linear-gradient(180deg,rgba(255,246,227,0.4) 0%, rgba(255,238,198,0.6) 100%);
z-index:-1;
}
.card{

-webkit-backdrop-filter:blur(24px) saturate(1.5);
border-radius:32px;
padding:42px 30px 30px;
text-align:center;
border:1.5px solid rgba(255,255,255,0.85);
box-shadow:
0 0 0 1px rgba(255,255,255,0.6) inset,
0 20px 60px rgba(90,60,20,0.15),
0 10px 25px rgba(90,60,20,0.1);
transform:perspective(1200px) rotateY(-3deg) rotateX(3deg);

}
