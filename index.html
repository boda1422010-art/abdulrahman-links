<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdulrahman Ehab</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(180deg,#1a0b3a 0%,#2d1a5e 30%,#1a0f2e 70%,#3d1f1f 100%);display:flex;justify-content:center;align-items:center;padding:20px;font-family:'Reem Kufi',sans-serif}
.card{width:100%;max-width:360px;background:rgba(15,15,15,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:32px;padding:36px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.avatar{width:120px;height:120px;margin:0 auto 20px;background:linear-gradient(135deg,#a855f7,#ec4899);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;font-weight:900;box-shadow:0 0 30px rgba(168,85,247,0.6),0 0 60px rgba(236,72,153,0.4);border:2px solid rgba(255,255,255,0.2)}
h1{color:#fff;font-size:26px;font-weight:700;margin-bottom:14px}
.badge{display:inline-block;background:rgba(100,60,180,0.3);border:1px solid rgba(120,80,200,0.4);color:#b794f6;padding:6px 16px;border-radius:99px;font-size:12px;margin-bottom:22px}
.links{display:flex;flex-direction:column;gap:12px}
.link{padding:18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:18px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;transition:0.2s}
.link:hover{background:rgba(255,255,255,0.1)}
.link.wa{background:linear-gradient(135deg,#22c55e,#16a34a);border:0;font-size:14px}
.footer{color:rgba(255,255,255,0.25);font-size:10px;margin-top:20px;font-family:Arial}
</style>
</head>
<body>
<div class="card">
<div class="avatar">
